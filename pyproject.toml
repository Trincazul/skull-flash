[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skull-flash"
version = "2.0.0"
description = "Professional security auditing tool"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "loguru>=0.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "python-nmap>=0.7",
    "python-whois>=0.9",
    "dnspython>=2.4",
    "phonenumbers>=8.12",
    "requests>=2.31",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "jinja2>=3.1",
    "weasyprint>=61.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
web = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
integrations = [
    "jira>=3.5",
]
all = [
    "skull-flash[web,integrations]",
]

[project.scripts]
skull-flash = "skullflash.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["skullflash"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=skullflash --cov-report=term-missing --cov-fail-under=70"
